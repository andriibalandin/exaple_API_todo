<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="auth-card">
        <h2 class="mb-4 text-center">Login</h2>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <div class="text-center mt-3">
                <a href="/ui/register/" class="text-decoration-none">Create an account</a>
            </div>
        </form>

        <div id="logout-section" class="mt-4 text-center" style="display:none;">
            <button id="logout-btn" class="btn btn-outline-danger">Logout</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const token = localStorage.getItem('access_token');
    if (token) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('logout-section').style.display = 'block';
    }

    document.getElementById('login-form').addEventListener('submit', async e => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
            const { data } = await axios.post('/api/token/', { username, password });
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
            window.location.href = '/ui/tasks/';
        } catch (err) {
            const msg = err.response?.data?.detail || 'Login failed';
            alert(msg);
        }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '/ui/login/';
    });
</script>
</body>
</html>
