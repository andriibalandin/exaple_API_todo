<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="auth-card">
        <h2 class="mb-4 text-center">Create Account</h2>

        <form id="register-form">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required minlength="3">
            </div>
            <div class="mb-3">
                <label class="form-label">Password <small class="text-muted">(min 8 chars)</small></label>
                <input type="password" class="form-control" id="password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
            <div class="text-center mt-3">
                <a href="/ui/login/" class="text-decoration-none">Already have an account?</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    document.getElementById('register-form').addEventListener('submit', async e => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
            const { data } = await axios.post('/api/register/', { username, password });
            localStorage.setItem('access_token', data.token.access);
            localStorage.setItem('refresh_token', data.token.refresh);
            alert('Registered! Redirecting...');
            window.location.href = '/ui/tasks/';
        } catch (err) {
            const errors = err.response?.data;
            let msg = 'Registration failed';
            if (errors && typeof errors === 'object') {
                msg = Object.values(errors).flat().join(', ');
            }
            alert(msg);
        }
    });
</script>
</body>
</html>
